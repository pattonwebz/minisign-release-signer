name: Minisign Release Signer
description: >-
  Sign release files with Minisign, verify against your public key, and
  optionally log to Sigstore Rekor.
author: William Patton

branding:
  icon: package
  color: purple

inputs:
  files:
    description: >-
      File(s) to sign, one path per line. Each gets a detached signature
      written next to it as <file>.minisig; the files themselves are not
      modified.
    required: true
  slug:
    description: Project/plugin slug, signed into the trusted comment of every signature.
    required: true
  file-labels:
    description: >-
      Optional per-file label, one per line, positionally aligned with
      `files` (blank line = no label for that file). Signed into that
      file's trusted comment as label:<label> — use to distinguish
      multiple artifacts signed in the same run (e.g. build variants).
      Leave empty to omit labels entirely.
    required: false
    default: ''
  version:
    description: Release version, signed into the trusted comment of every signature.
    required: true
  secret-key:
    description: Contents of the minisign secret key file. Pass a repo/org secret.
    required: true
  secret-key-password:
    description: Password for the secret key (pass a separate secret). Leave empty for unencrypted keys.
    required: false
    default: ''
  public-key:
    description: >-
      The minisign public key the signatures will be verified against (bare
      base64 line or full minisign.pub contents). The action fails if its own
      output does not verify against this key.
    required: true
  rekor-upload:
    description: Record each signature in the Rekor transparency log.
    required: false
    default: 'true'
  rekor-required:
    description: >-
      Fail the job if a Rekor upload fails. Default false: Rekor being
      unreachable warns but does not block the release.
    required: false
    default: 'false'
  rekor-server:
    description: Rekor server URL.
    required: false
    default: 'https://rekor.sigstore.dev'
  rekor-extra-args:
    description: >-
      Extra flags appended verbatim to every `rekor-cli upload` call
      (whitespace-separated) — use for any additional naming or identifier
      flags Rekor needs. The release slug/version are already recorded in the
      log via the signature's trusted comment.
    required: false
    default: ''
  minisign-version:
    description: minisign release to download.
    required: false
    default: '0.12'
  minisign-sha256:
    description: Pinned sha256 of the minisign linux release tarball.
    required: false
    default: '9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73'
  rekor-cli-version:
    description: rekor-cli release to download.
    required: false
    default: 'v1.5.3'
  rekor-cli-sha256:
    description: Pinned sha256 of the rekor-cli linux-amd64 binary.
    required: false
    default: 'c519704f8e665c192dbf190d3ac977068d3e74163951a50b3d34972478e5bbb0'
  rekor-cli-arm64-sha256:
    description: Pinned sha256 of the rekor-cli linux-arm64 binary.
    required: false
    default: 'ed512351029db07af8ce34a8bbcbb2938e229681df74cd4ae26fed92682d0faa'

outputs:
  files:
    description: The signed files, one per line (same order as the input).
    value: ${{ steps.sign.outputs.files }}
  signatures:
    description: The generated .minisig signature paths, one per line, aligned with files.
    value: ${{ steps.sign.outputs.signatures }}
  rekor-indexes:
    description: Rekor log index per file ('-' where upload was skipped/failed).
    value: ${{ steps.sign.outputs.rekor-indexes }}
  rekor-locations:
    description: Rekor entry URL per file ('-' where upload was skipped/failed).
    value: ${{ steps.sign.outputs.rekor-locations }}

runs:
  using: composite
  steps:
    - name: Install minisign and rekor-cli (pinned)
      id: install-tools
      shell: bash
      # All inputs are passed through env, never interpolated into this
      # script body: a ${{ }} expression expands as literal text before bash
      # runs, so interpolating an attacker-influenced value (e.g. a release
      # tag) directly into run: is a shell-injection vector.
      env:
        MINISIGN_VERSION: ${{ inputs.minisign-version }}
        MINISIGN_SHA256: ${{ inputs.minisign-sha256 }}
        REKOR_UPLOAD: ${{ inputs.rekor-upload }}
        REKOR_CLI_VERSION: ${{ inputs.rekor-cli-version }}
        REKOR_CLI_SHA256: ${{ inputs.rekor-cli-sha256 }}
        REKOR_CLI_ARM64_SHA256: ${{ inputs.rekor-cli-arm64-sha256 }}
      run: |
        set -euo pipefail
        TOOLS="${RUNNER_TEMP}/minisign-release-signer"
        mkdir -p "$TOOLS"

        arch="$(uname -m)"
        case "$arch" in
          x86_64|amd64) MINISIGN_ARCH="x86_64"; REKOR_ARCH="amd64" ;;
          aarch64|arm64) MINISIGN_ARCH="aarch64"; REKOR_ARCH="arm64" ;;
          *) echo "Unsupported runner architecture: $arch (need x86_64 or arm64)" >&2; exit 1 ;;
        esac

        curl -sSfL --proto '=https' -o "$TOOLS/minisign.tar.gz" \
          "https://github.com/jedisct1/minisign/releases/download/${MINISIGN_VERSION}/minisign-${MINISIGN_VERSION}-linux.tar.gz"
        echo "${MINISIGN_SHA256}  $TOOLS/minisign.tar.gz" | sha256sum -c -
        tar xzf "$TOOLS/minisign.tar.gz" -C "$TOOLS"
        # Written as a step output (not $GITHUB_ENV): $GITHUB_ENV persists for
        # the rest of the *calling job*, not just this action, so a caller's
        # later step could unexpectedly inherit MINISIGN_BIN/REKOR_BIN.
        echo "minisign-bin=$TOOLS/minisign-linux/${MINISIGN_ARCH}/minisign" >> "$GITHUB_OUTPUT"

        if [ "${REKOR_UPLOAD}" = "true" ]; then
          curl -sSfL --proto '=https' -o "$TOOLS/rekor-cli" \
            "https://github.com/sigstore/rekor/releases/download/${REKOR_CLI_VERSION}/rekor-cli-linux-${REKOR_ARCH}"
          if [ "$REKOR_ARCH" = "amd64" ]; then
            echo "${REKOR_CLI_SHA256}  $TOOLS/rekor-cli" | sha256sum -c -
          else
            echo "${REKOR_CLI_ARM64_SHA256}  $TOOLS/rekor-cli" | sha256sum -c -
          fi
          chmod +x "$TOOLS/rekor-cli"
          echo "rekor-bin=$TOOLS/rekor-cli" >> "$GITHUB_OUTPUT"
        fi

    - name: Sign, verify, and log
      id: sign
      shell: bash
      env:
        MINISIGN_BIN: ${{ steps.install-tools.outputs.minisign-bin }}
        REKOR_BIN: ${{ steps.install-tools.outputs.rekor-bin }}
        MINISIGN_SECRET_KEY: ${{ inputs.secret-key }}
        MINISIGN_SECRET_KEY_PASSWORD: ${{ inputs.secret-key-password }}
        MINISIGN_PUBLIC_KEY: ${{ inputs.public-key }}
        REKOR_UPLOAD: ${{ inputs.rekor-upload }}
        REKOR_REQUIRED: ${{ inputs.rekor-required }}
        REKOR_SERVER: ${{ inputs.rekor-server }}
        REKOR_EXTRA_ARGS: ${{ inputs.rekor-extra-args }}
        FILE_LABELS: ${{ inputs.file-labels }}
        INPUT_FILES: ${{ inputs.files }}
        INPUT_SLUG: ${{ inputs.slug }}
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        FILES=()
        while IFS= read -r line; do
          # Strip a trailing CR so a CRLF-edited workflow file's multiline
          # `files:` block doesn't leave "path\r" entries that fail -f checks.
          line="${line%$'\r'}"
          [ -n "$line" ] && FILES+=( "$line" )
        done <<< "$INPUT_FILES"

        # "--" stops option parsing so a file named like a flag is never
        # consumed as one.
        "${ACTION_PATH}/scripts/sign-and-log.sh" \
          --slug "$INPUT_SLUG" \
          --version "$INPUT_VERSION" \
          -- "${FILES[@]}"
